<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vesign — Under Maintenance</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root {
      --bg:      #0b0e18;
      --surface: #141824;
      --border:  #242838;
      --text:    #e8eaf0;
      --muted:   #8b90a0;
      --green:   #2ecc71;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        radial-gradient(ellipse 100% 80% at 0% 0%, rgba(45,147,204,0.16) 0%, transparent 100%),
        radial-gradient(ellipse 80% 80% at 100% 100%, rgba(83,229,239,0.09) 0%, transparent 100%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 56px 64px;
      text-align: center;
      max-width: 480px;
      width: 90%;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-weight: 900;
      font-size: 2.1rem;
      letter-spacing: 0.08em;
      margin-bottom: 32px;
    }

    .logo img {
      height: 2.5rem;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0, 210, 255, 0.6));
    }

    .logo .esign {
      background: linear-gradient(180deg, #53e5ef 0%, #2d93cc 55%, #2262a8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 2px 4px rgba(47, 190, 222, 0.5);
    }

    .icon {
      font-size: 52px;
      margin-bottom: 24px;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.7; transform: scale(0.95); }
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
    }

    p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
    }

    .badge {
      display: inline-block;
      margin-top: 28px;
      padding: 6px 16px;
      background: rgba(46, 204, 113, 0.12);
      border: 1px solid rgba(46, 204, 113, 0.3);
      border-radius: 20px;
      font-size: 12px;
      color: var(--green);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/favicon.png" alt="V" />
      <span class="esign">esign</span>
    </div>
    <div class="icon">🛠️</div>
    <h1>Under Maintenance</h1>
    <p>We're making improvements to bring you a better experience.<br>We'll be back shortly.</p>
    <div class="badge">⚡ Back online soon</div>
  </div>
</body>
</html>
